
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Official website of DarkV Studios, an independent game development studio.">
  <title>DarkV Studios</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #101014;
      color: #f5f5f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 24px 8%;
      border-bottom: 1px solid #292932;
    }

    header h1 {
      font-size: 24px;
      color: #a78bfa;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px 20px;
    }

    main h2 {
      font-size: clamp(32px, 6vw, 52px);
      margin-bottom: 20px;
    }

    main p {
      max-width: 520px;
      color: #aaaab5;
      font-size: 17px;
      line-height: 1.7;
    }

    .tag {
      color: #a78bfa;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 3px;
      margin-bottom: 18px;
    }

    footer {
      padding: 24px;
      text-align: center;
      color: #777783;
      border-top: 1px solid #292932;
      font-size: 13px;
    }
  </style>
</head>

<body>
<header>
  <h1>DarkV Studios</h1>
</header>

<main>
  <div class="tag">INDEPENDENT GAME DEVELOPMENT</div>

  <h2>Welcome to DarkV Studios</h2>

  <p>
    DarkV Studios is an independent game development studio
    focused on creating original games and unique gaming
    experiences.
  </p>
</main>

<footer>
  &copy; 2026 DarkV Studios. All rights reserved.
</footer>
</body>
</html>
